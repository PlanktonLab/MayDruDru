<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交易紀錄聚焦示意</title>
<style>
:root{
  --ink:#2f3337;      /* 主要文字 */
  --ink2:#6f757b;     /* 次要文字 */
  --ph1:#d4d8dc;      /* 佔位：主層級 */
  --ph2:#e6e9ec;      /* 佔位：次層級 */
  --line:#e3e6e9;
  --list-bg:#eaf5f5;
  --teal:#5bbdb3;     /* 品牌強調色 */
  --orange:#f5a623;
  --grad:linear-gradient(90deg,#4f7fe0 0%,#58a9d6 55%,#5ec4c8 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;
  font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--ink)}
.frame{width:390px;max-width:100%;border-radius:28px;overflow:hidden;border:1px solid #e1e4e8;
  box-shadow:0 12px 40px rgba(30,40,60,.08);background:var(--list-bg)}
/* 導覽列 */
.nav{background:var(--grad);height:70px;position:relative;display:flex;align-items:center;justify-content:center;padding-bottom:14px}
.nav .back{position:absolute;left:18px;top:19px;width:12px;height:20px}
.nav h1{color:#fff;font-size:20px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.info{width:16px;height:16px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
/* 白色面板 */
.sheet{background:#fff;border-radius:18px 18px 0 0;margin-top:-16px;position:relative;border-bottom:1px solid var(--line)}
.card-sel{height:49px;margin:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.card-sel .name{font-size:15.5px;color:#3d4247;letter-spacing:.2px}
.card-sel .dots{letter-spacing:1px;margin:0 3px;font-family:-apple-system,Helvetica,Arial,sans-serif;font-weight:700}
.count{height:50px;margin:0 15px;display:flex;align-items:center;justify-content:space-between}
.count span.t{font-size:14.5px;color:#4a4f54;display:flex;align-items:center;gap:6px}
.btn{background:var(--teal);color:#fff;height:29px;width:119px;border-radius:15px;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px 0 18px;font-size:15px;font-weight:500;letter-spacing:1px}
/* 清單 */
.list{padding:10px 10px 12px}
.row{background:#fff;border-radius:17px;height:70px;margin-bottom:9.4px;padding:0 14px 0 10px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row:last-child{margin-bottom:0}
.col{display:flex;flex-direction:column;gap:10px;justify-content:center}
.col>.ph.b{margin:4.5px 0}
.col.r{align-items:flex-end}
.amt{display:flex;align-items:center;gap:10px;height:20px}
.title{font-size:16px;line-height:20px;height:20px;color:var(--ink)}
.date{font-size:13.5px;line-height:19px;color:var(--ink2);letter-spacing:.2px}
.money{font-size:16px;line-height:20px;color:var(--ink)}
.ph{display:block;height:9px;border-radius:4.5px;background:var(--ph2)}
.ph.b{height:11px;border-radius:5.5px;background:var(--ph1)}
.ph.in{display:inline-block;width:10px;height:9px;border-radius:4.5px;background:var(--ph1)}
.spacer{height:19px}
.spacer.s{height:9px}
.chev{width:8px;height:13px;flex:none}
</style>
</head>
<body>
<div class="frame">
  <div class="nav">
    <svg class="back" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>交易紀錄<span class="info">i</span></h1>
  </div>

  <div class="sheet">
    <!-- 重點一：卡片選擇 -->
    <div class="card-sel">
      <span class="name">示範銀行簽帳金融卡 <span class="dots">••••</span> 1234</span>
      <svg width="15" height="9" viewBox="0 0 15 9"><path d="M1.5 1.5 7.5 7l6-5.5" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="count">
      <span class="t">共 <span class="ph in"></span> 筆交易紀錄</span>
      <span class="btn">全部顯示
        <svg width="13" height="8" viewBox="0 0 13 8"><path d="M1.5 1.5 6.5 6l5-4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>
  </div>

  <div class="list">
    <div class="row">
      <div class="col"><span class="ph b" style="width:120px"></span><span class="ph" style="width:118px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:52px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="ph" style="width:56px;margin-right:18px"></span></div>
    </div>
    <div class="row">
      <div class="col"><span class="ph b" style="width:150px"></span><span class="ph" style="width:118px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:58px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spacer s"></span></div>
    </div>
    <div class="row">
      <div class="col"><span class="ph b" style="width:172px"></span><span class="ph" style="width:120px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:58px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spacer s"></span></div>
    </div>
    <div class="row">
      <div class="col"><span class="ph b" style="width:190px"></span><span class="ph" style="width:122px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:58px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spacer s"></span></div>
    </div>
    <!-- 重點二：目標交易（假資料） -->
    <div class="row">
      <div class="col"><span class="title">Cloud Hosting Co.</span><span class="date">2026/01/12 09:30:00</span></div>
      <div class="col r"><div class="amt"><span class="money">$ 260.00</span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#2f3337" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spacer"></span></div>
    </div>
    <div class="row">
      <div class="col"><span class="ph b" style="width:168px"></span><span class="ph" style="width:118px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:78px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spacer s"></span></div>
    </div>
    <div class="row">
      <div class="col"><span class="ph b" style="width:112px"></span><span class="ph" style="width:122px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:58px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="spacer s"></span></div>
    </div>
    <div class="row">
      <div class="col"><span class="ph b" style="width:120px"></span><span class="ph" style="width:122px"></span></div>
      <div class="col r"><div class="amt"><span class="ph b" style="width:62px"></span><svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="#c9cdd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="ph" style="width:56px;margin-right:18px"></span></div>
    </div>
  </div>
</div>
</body>
</html>
