[project]
name = "maydru-api"
version = "0.1.0"
description = "MayDru 統一後端（FastAPI）"
requires-python = ">=3.12"
# Versions are pinned to exactly what SOP_Tutor/backend ran with, so the copied
# test suite behaves identically. docker/ installs the same set via uv.lock.
dependencies = [
  "fastapi[standard]==0.141.1",
  "sqlalchemy[asyncio]==2.0.54",
  "asyncpg==0.31.0",
  "psycopg[binary,pool]==3.3.5",
  "pgvector==0.5.0",
  "alembic==1.20.0",
  "pydantic-settings==2.15.0",
  "arq==0.28.0",
  "redis==5.3.1",
  "minio==7.2.20",
  "cryptography==50.0.1",
  "pillow==12.3.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "pyjwt==2.14.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "langchain==1.4.0",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  # LINE channel (SPEC §8) — webhook signature verification + Messaging API.
  "line-bot-sdk>=3.19",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aiosqlite==0.22.1",
  "ruff>=0.14",
  "mypy>=1.18",
  "import-linter>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
