# MayDru 主機 nginx（Ubuntu 24.04 / nginx 1.24，SPEC §13.4）
#
#   /etc/nginx/sites-available/maydru.conf → sites-enabled/ 建立 symlink
#   nginx -t && systemctl reload nginx
#
# Cloudflare proxied；origin cert 需涵蓋三個名稱（萬用或重簽），放在 /etc/ssl/cloudflare/。
# 三個 server block 都只 proxy 到 127.0.0.1 的 compose 連接埠：
#   maydru.xamjiang.com        → 8202 apply-web（市民）
#   maydru-admin.xamjiang.com  → 8201 admin-web（承辦人）
#   maydru-api.xamjiang.com    → 8200 api（/line/webhook、/v1、/api、/media）

# Cloudflare 會帶真實來源 IP，但只有從 Cloudflare 來的連線才可信。
# 若尚未設定 set_real_ip_from，$remote_addr 就是 Cloudflare 的邊緣節點位址。

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 三個名稱共用的 TLS 與安全標頭設定
# （nginx 沒有 include 片段的必要，直接在各 server block 重複，保持單檔可讀）

server {
  listen 80;
  listen [::]:80;
  server_name maydru.xamjiang.com maydru-admin.xamjiang.com maydru-api.xamjiang.com;
  # Cloudflare 以 HTTPS 回源；80 只留給偶發的直連與 ACME
  return 301 https://$host$request_uri;
}

# ------------------------------------------------------------ apply-web（市民）
server {
  # Ubuntu 24.04 ships nginx 1.24; the standalone `http2 on` directive is 1.25.1+.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name maydru.xamjiang.com;

  ssl_certificate     /etc/ssl/cloudflare/xamjiang-cert.pem;
  ssl_certificate_key /etc/ssl/cloudflare/xamjiang-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:8202;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    # 市民上傳的文件照片不落地：直接串流給後端
    proxy_request_buffering off;
  }
}

# -------------------------------------------------------- admin-web（承辦人）
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name maydru-admin.xamjiang.com;

  ssl_certificate     /etc/ssl/cloudflare/xamjiang-cert.pem;
  ssl_certificate_key /etc/ssl/cloudflare/xamjiang-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:8201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }
}

# ------------------------------------------------------------------- api
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name maydru-api.xamjiang.com;

  ssl_certificate     /etc/ssl/cloudflare/xamjiang-cert.pem;
  ssl_certificate_key /etc/ssl/cloudflare/xamjiang-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # 上傳上限（SPEC §13.4）：證明文件與承辦人原圖
  client_max_body_size 20m;
  client_body_timeout 30s;

  location / {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆寫而非附加：永遠不信任 client 帶來的鏈
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    # 上傳不進暫存檔，直接串流（SPEC §11：市民圖片只在記憶體）
    proxy_request_buffering off;
  }
}
