name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 測試與 lint 永不連真實 LINE / LLM（CLAUDE.md 規則 7）
  LLM_PROVIDER: fake
  LINE_SENDER: noop

jobs:
  python:
    name: python (ruff / mypy / import-linter / pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check

      - name: mypy
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports --config pyproject.toml

      - name: pytest
        working-directory: apps/api
        run: uv run --package maydru-api pytest -q

  node:
    name: node (typecheck / oxlint / vitest / build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: OpenAPI client 同步
        run: |
          npm run generate -w @maydru/api-client -- ../../apps/api/openapi.json
          git diff --exit-code -- packages/api-client/src/schema.d.ts

      - name: typecheck
        run: npm run typecheck

      - name: lint (oxlint)
        run: npm run lint

      - name: vitest
        run: npm test

      - name: build
        run: npm run build

  e2e:
    name: e2e (MayDru workflow)
    runs-on: ubuntu-24.04
    needs: [python, node]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --frozen
      - name: 送件 → 退件 → LINE/SOP → 補件 → 核准 → 推播
        working-directory: apps/api
        run: uv run --package maydru-api python scripts/e2e_maydru.py

  docker:
    name: docker buildx (arm64 + amd64)
    runs-on: ubuntu-24.04
    needs: [python, node]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api,       dockerfile: docker/api.Dockerfile }
          - { name: worker,    dockerfile: docker/worker.Dockerfile }
          - { name: renderer,  dockerfile: docker/renderer.Dockerfile }
          - { name: admin-web, dockerfile: docker/admin-web.Dockerfile }
          - { name: apply-web, dockerfile: docker/apply-web.Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/arm64,linux/amd64
          # PR 只驗證建得起來；只有 main 的 push 才推 GHCR
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/maydru-${{ matrix.image.name }}:latest
            ghcr.io/${{ github.repository_owner }}/maydru-${{ matrix.image.name }}:${{ github.sha }}
          build-args: |
            VITE_LINE_OA_ID=${{ vars.VITE_LINE_OA_ID }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
