# Public Step Card images are content-hashed and immutable: cache them at the edge.
# Only /media/ uses this cache; nothing private or citizen-provided is ever stored here.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=1g inactive=30d use_temp_path=off;

upstream maydru_api {
  server api:8000;
  keepalive 16;
}

server {
  listen 80;
  server_tokens off;

  # Uploads (citizen screenshots, officer originals) must never touch disk:
  # keep the whole body in memory and stream it to the API without temp files.
  client_max_body_size 25m;
  client_body_buffer_size 25m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  keepalive_timeout 30s;

  # Applies to every location below (none of them declares its own add_header).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never trust a client-supplied chain
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;

  location /api/ {
    proxy_pass http://maydru_api;
    proxy_request_buffering off;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
  }

  location /v1/ {
    proxy_pass http://maydru_api;
    proxy_request_buffering off;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
  }

  location /media/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://maydru_api;
    proxy_read_timeout 30s;
    proxy_cache media;
    proxy_cache_key $uri;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
  }


  # Container liveness for docker compose: answered by nginx itself, never proxied.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    proxy_pass http://maydru_api;
    proxy_read_timeout 10s;
  }

  # SPA: hashed build assets are immutable; index.html is always revalidated.
  location /assets/ {
    root /usr/share/nginx/html;
    expires max;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    expires -1;
    try_files $uri /index.html;
  }
}
