name: maydru

# Development stack. Every port is bound to 127.0.0.1 and deliberately offset from
# SOP_Tutor's (5432/6379/9000/8100/8000/8080) so both stacks can run side by side
# until the cut-over is confirmed (SPEC §13.3).
#   api 8200 · admin-web 8201 · apply-web 8202 · renderer 8101
#   postgres 5433 · redis 6380 · minio 9002/9003
# Deployments use docker-compose.prod.yml, which sets ENV=production; the API then
# refuses to start on insecure defaults (see app/config.py::insecure_defaults).

x-restart: &restart
  restart: unless-stopped

x-backend-env: &backend-env
  ENV: ${ENV:-development}
  DATABASE_URL: postgresql+asyncpg://maydru:${POSTGRES_PASSWORD:-maydru}@postgres:5432/maydru
  DATABASE_URL_SYNC: postgresql://maydru:${POSTGRES_PASSWORD:-maydru}@postgres:5432/maydru
  REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
  S3_ENDPOINT: minio:9000
  # Used only for browser-facing presigned URLs. It must be reachable from the
  # host browser, unlike the internal `minio:9000` service hostname above.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9002}
  S3_PUBLIC_SECURE: ${S3_PUBLIC_SECURE:-false}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  # Keep these explicit: a migrated SOP_Tutor installation retains its original
  # bucket names, while a fresh MayDru stack uses the defaults below.
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-maydru-private}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-maydru-public}
  RENDERER_URL: http://renderer:8100
  RENDERER_TOKEN: ${RENDERER_TOKEN:-}
  PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:8202/media}
  APPLY_WEB_BASE_URL: ${APPLY_WEB_BASE_URL:-http://localhost:8202}
  ADMIN_WEB_BASE_URL: ${ADMIN_WEB_BASE_URL:-http://localhost:8201}
  SECRET_KEY: ${SECRET_KEY:-change-me-please}
  ORIGINAL_ENCRYPTION_KEY: ${ORIGINAL_ENCRYPTION_KEY:-}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
  # LINE channel: noop never touches the network. Only set LINE_SENDER=line with real credentials.
  LINE_SENDER: ${LINE_SENDER:-noop}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.6-luna}
  MODEL_REPLICA: ${MODEL_REPLICA:-gpt-5.6-sol}
  MODEL_STRUCTURE: ${MODEL_STRUCTURE:-}
  MODEL_STYLEDOC: ${MODEL_STYLEDOC:-}
  MODEL_DESCRIBE: ${MODEL_DESCRIBE:-}
  MODEL_RERANK: ${MODEL_RERANK:-}
  MODEL_INTENT: ${MODEL_INTENT:-}
  MODEL_ASSISTANT: ${MODEL_ASSISTANT:-}
  REPLICA_VISUAL_REVIEW: ${REPLICA_VISUAL_REVIEW:-true}
  VISUAL_REVIEW_MIN_SCORE: ${VISUAL_REVIEW_MIN_SCORE:-0.85}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
  ORIGINAL_TTL_DAYS: ${ORIGINAL_TTL_DAYS:-7}
  LOCATE_CONFIDENCE_THRESHOLD: ${LOCATE_CONFIDENCE_THRESHOLD:-0.6}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
  BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
  BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8201","http://localhost:8202","http://localhost:5173","http://localhost:5174"]}

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: maydru
      # only applied when the data volume is first initialised
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maydru}
      POSTGRES_DB: maydru
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U maydru"], interval: 5s, timeout: 3s, retries: 20 }
    ports: ["127.0.0.1:5433:5432"]

  redis:
    <<: *restart
    image: redis:8.10.1-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # --requirepass only when REDIS_PASSWORD is set; passed via env, not interpolated into the command
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly no $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:6380:6379"]

  minio:
    <<: *restart
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 30 }
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]

  renderer:
    <<: *restart
    build: { context: ., dockerfile: docker/renderer.Dockerfile }
    init: true  # reaps Chromium child processes
    environment:
      ENV: ${ENV:-development}
      RENDERER_TOKEN: ${RENDERER_TOKEN:-}
    healthcheck: { test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""], interval: 10s, timeout: 25s, retries: 10 }
    ports: ["127.0.0.1:8101:8100"]

  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./docker/otel-collector.yaml:/etc/otel/config.yaml:ro"]

  api:
    <<: *restart
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    ports: ["127.0.0.1:8200:8000"]

  worker:
    <<: *restart
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }
      renderer: { condition: service_healthy }

  admin-web:
    <<: *restart
    build: { context: ., dockerfile: docker/admin-web.Dockerfile }
    depends_on: [api]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"], interval: 10s, timeout: 5s, retries: 10 }
    ports: ["127.0.0.1:8201:80"]

  apply-web:
    <<: *restart
    build: { context: ., dockerfile: docker/apply-web.Dockerfile }
    depends_on: [api]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"], interval: 10s, timeout: 5s, retries: 10 }
    ports: ["127.0.0.1:8202:80"]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
